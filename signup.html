<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>Create account | Flexible Finance Tracker</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-auth-mode="signup">
  <main class="auth-view">
    <section class="auth-card entrance entrance-1" aria-labelledby="authTitle">
      <div class="auth-brand">
        <p class="eyebrow">Flexible finance tracker</p>
        <h1 id="authTitle">Create your account</h1>
        <p class="subhead">Save your finances and goals across devices.</p>
      </div>

      <form id="authForm" class="auth-form">
        <label>Username
          <input id="displayName" type="text" autocomplete="nickname" minlength="2" maxlength="40" required placeholder="e.g. iliketohuntxmm69" />
          <small class="field-hint">Unique, not case-sensitive.</small>
        </label>
        <label>Email
          <input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com" />
        </label>
        <label>Password
          <input id="authPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters" />
        </label>
        <p id="authMessage" class="auth-message" role="status" hidden></p>
        <button class="button primary full-width" type="submit">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="index.html">Log in</a></p>
      <p class="auth-switch">Want a preview? <a href="demo.html">View demo</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
